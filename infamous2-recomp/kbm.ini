; kbm.ini -- keyboard + mouse controls for the inFamous 2 recomp
;
; The game only knows the DualShock 3; keyboard + mouse are mapped onto pad port 0.
; A controller (XInput) keeps working at the same time: buttons are combined, and a stick
; driven by keys / mouse overrides that controller stick only while it is in use.
;
; Where this file is read from: %KBM_INI% if set, else kbm.ini in the working directory
; (run.cmd -> this folder), else next to the exe, else one folder above the exe.
; Saving the file applies the changes within about a second; no restart is needed.
;
; Mouse handling: while the game window has focus the cursor is hidden and held at the window
; centre, and raw mouse motion turns the camera (right stick).
;   F9           release the mouse / capture it again (a left click in the window also captures it)
;   Alt-Tab      releases it automatically (so does minimising or any other focus loss)
;   Shift+Esc    quits the game (Esc on its own is START = pause)
;
; Environment overrides (applied after this file, read once at start-up):
;   KBM=0                    turn KBM off completely (the old fixed keyboard fallback, Esc quits)
;   KBM=1                    force KBM on, even in scripted or test sessions (PAD_SCRIPT / PAD_FILE /
;                            PAD_AUTOPRESS / PAD_NO_KEYBOARD switch it off by default)
;   KBM_<OPTION>=v           any [kbm] option, e.g. KBM_MOUSE_SENS=3.5  KBM_INVERT_Y=1
;   KBM_BIND_<ACTION>=keys   any binding, e.g. KBM_BIND_CROSS=Space,J
;   KBM_INI=<path>           read a different file
;   KBM_TEST="t0-t1:item;.." synthetic input for automated tests (seconds after pad init; item = an
;                            action name, mouse_x=<counts/s>, mouse_y=<counts/s>, wheel_up, wheel_down).
;                            The real keyboard and mouse are then ignored unless KBM_TEST_REAL=1.

[kbm]
enabled = 1            ; 0 = off (same as KBM=0, but this one can be changed while the game is running)
capture = 1            ; 1 = hide the cursor and hold it at the centre while focused; 0 = keep the cursor
                       ;     visible and free (mouse look still works)
log = 0                ; set to 1 temporarily when diagnosing input; normal play avoids logging work

; --- mouse -> right stick (camera) ---
; Deflection = mouse speed (counts per second) * mouse_sens / 10000, then
;   * (1 + mouse_accel * deflection)  ->  ^ mouse_curve  ->  remapped to [mouse_deadzone .. 1].
; mouse_sens 6 reaches full deflection at ~1700 counts/s (about 5 cm/s at 800 DPI).
; The game caps camera speed at full deflection; mouse_carry (below) keeps the rest of a fast flick
; turning on the next frames instead of throwing it away.
mouse_sens     = 6     ; was 2.5 (felt slow). Raise for faster turning, lower for finer aim.
mouse_sens_y   = 0.8   ; multiplier for vertical sensitivity
mouse_accel    = 0     ; > 0 = faster movements turn disproportionately faster (try 0.5)
mouse_curve    = 0.8   ; < 1 boosts small movements (the game's stick response is slow near centre), > 1 damps them
mouse_deadzone = 0.12  ; any mouse movement gives at least this deflection, to get past the game's own stick
                       ; deadzone (raise it if small movements do nothing, lower it if aiming jitters)
mouse_smooth   = 0     ; 0..0.95: blends each pad report with the previous one (adds latency)
mouse_carry    = 0.4   ; seconds: a flick faster than the game's max camera speed keeps turning until the
                       ; whole movement is used (up to this long). 0 = old behaviour (excess thrown away)
invert_y       = 0     ; 1 = moving the mouse forward looks down (the in-game invert option also applies)

; --- keys -> sticks ---
walk_scale      = 0.45 ; normal left-stick deflection; holding `run` uses full deflection
look_keys_scale = 0.7  ; deflection for the optional rs_* look keys
wheel_ms        = 80   ; one wheel notch = a press of this many ms

[bind]
; action = key[, key ...]   (up to 4 keys per action; "none" = unbound)
; Key names: A-Z 0-9 F1-F24 Space Enter Esc Tab Backspace CapsLock LShift RShift Shift LCtrl RCtrl Ctrl
;   LAlt RAlt Alt Up Down Left Right Insert Delete Home End PgUp PgDn Num0-Num9 NumPlus NumMinus NumStar
;   NumSlash NumDot Grave Minus Equals LBracket RBracket Backslash Semicolon Quote Comma Period Slash
;   LMB RMB MMB MB4 MB5 (= Mouse1..Mouse5) WheelUp WheelDown, or a Windows virtual-key code like 0x41.
;
; Defaults follow the inFamous 2 PS3 manual. The functions in brackets are what the game itself does
; with each pad button.

; left stick (move)
ls_up    = W
ls_down  = S
ls_left  = A
ls_right = D
run      = LShift             ; hold to run at full stick deflection

cross    = Space              ; X: jump / climb   (while aiming: Blast)        menus: select
circle   = C, Backspace       ; O: drop / take cover / dive roll              menus: back
square   = E                  ; []: melee          (while aiming: Grenade)
triangle = F                  ; /\: interact / melee finisher / look (while aiming: Rocket)

l1       = RMB                ; L1: aim mode
r1       = LMB                ; R1: lock-on        (while aiming: Bolt)
l2       = Q                  ; L2: electric drain (hold)
r2       = R                  ; R2: kinetic pulse / misc powers
l3       = V                  ; L3: radar pulse
r3       = MMB, X             ; R3: switch the reticle to the other shoulder

up       = 1, Up, MB5, WheelUp     ; d-pad up (hold: precision)
right    = 2, Right
down     = 3, Down, MB4, WheelDown
left     = 4, Left

start    = Esc, Enter         ; pause menu ("Press START")
select   = Tab, M             ; map

; optional keyboard camera (right stick)
rs_up    = none
rs_down  = none
rs_left  = none
rs_right = none

toggle_capture = F9           ; release / recapture the mouse
